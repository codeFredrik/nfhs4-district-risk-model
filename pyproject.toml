[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nfhs"
version = "0.1.0"
description = "NFHS-4 District Child Stunting Analysis and Risk Segmentation"
authors = [{ name = "Fredrik" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.1.4",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "shap>=0.44.0",
    "statsmodels>=0.14.0",
    "scipy>=1.12.0",
    "joblib>=1.3.2",
    "PyYAML>=6.0.1",
    "typer>=0.12.0",
    "streamlit>=1.30.0",
    "plotly>=5.24.0",
    "rapidfuzz>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
